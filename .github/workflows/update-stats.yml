name: Update Social Statistics

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Updater Script
        run: |
          python -c '
          import json, datetime

          # Replace these with your real scraper or counter values
          data = {
              "youtube": {"subscribers": 412000, "views": 38000000},
              "tiktok": {"followers": 1200000, "likes": 18500000},
              "instagram": {"followers": 480000, "posts": 340},
              "facebook": {"followers": 95000, "likes": 88000},
              "lastUpdated": datetime.date.today().isoformat()
          }

          with open("stats.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.json
          git commit -m "Auto-update stats.json [skip ci]" || echo "No changes to commit"
          git push
